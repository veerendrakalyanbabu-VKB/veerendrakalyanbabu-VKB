<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="300" viewBox="0 0 1200 300" role="img" aria-labelledby="title desc">
  <title id="title">Veerendra Kalyan Babu — Applied AI Systems</title>
  <desc id="desc">A dark technical banner with a restrained node network and engineering focus areas.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#07111f"/>
      <stop offset="0.52" stop-color="#0b1530"/>
      <stop offset="1" stop-color="#10152b"/>
    </linearGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#34d6ff"/>
      <stop offset="0.55" stop-color="#6d7cff"/>
      <stop offset="1" stop-color="#a970ff"/>
    </linearGradient>
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M40 0H0V40" fill="none" stroke="#8ba3c7" stroke-opacity=".07"/>
    </pattern>
    <filter id="glow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="7" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>
  <rect width="1200" height="300" rx="24" fill="url(#bg)"/>
  <rect width="1200" height="300" rx="24" fill="url(#grid)"/>
  <rect x="1" y="1" width="1198" height="298" rx="23" fill="none" stroke="#90a7cf" stroke-opacity=".18"/>
  <path d="M0 246C190 207 309 276 492 232S790 184 1200 229" fill="none" stroke="url(#accent)" stroke-opacity=".18" stroke-width="2"/>
  <g fill="none" stroke="#6e86ff" stroke-opacity=".34">
    <path d="M930 62l92 42 76-33 54 67-85 60-98-30-66 47"/>
    <path d="M1022 104l45 94m31-127l-129 97m-66 47l66-47-39-106"/>
  </g>
  <g fill="#0b1530" stroke="url(#accent)" stroke-width="2" filter="url(#glow)">
    <circle cx="930" cy="62" r="7"/><circle cx="1022" cy="104" r="8"/>
    <circle cx="1098" cy="71" r="6"/><circle cx="1152" cy="138" r="8"/>
    <circle cx="1067" cy="198" r="7"/><circle cx="969" cy="168" r="9"/>
    <circle cx="903" cy="215" r="6"/>
  </g>
  <rect x="70" y="62" width="76" height="27" rx="13.5" fill="#122443" stroke="#34d6ff" stroke-opacity=".55"/>
  <text x="108" y="80" text-anchor="middle" fill="#81e8ff" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="12" letter-spacing="2">VKB / AI</text>
  <text x="70" y="137" fill="#f4f7ff" font-family="Inter, ui-sans-serif, system-ui, sans-serif" font-size="42" font-weight="700" letter-spacing="-.8">Veerendra Kalyan Babu</text>
  <text x="72" y="177" fill="#aebbd4" font-family="Inter, ui-sans-serif, system-ui, sans-serif" font-size="19" letter-spacing=".6">APPLIED AI SYSTEMS · TRUST · RETRIEVAL · OPERATIONS</text>
  <rect x="72" y="207" width="410" height="3" rx="1.5" fill="url(#accent)"/>
  <text x="72" y="245" fill="#7f91af" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="13" letter-spacing="1.4">DESIGN / BUILD / TEST / SHIP / LEARN</text>
